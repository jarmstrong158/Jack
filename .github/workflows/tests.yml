name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        # numpy only, deliberately. torch is a real dependency of the project
        # but only agent/ppo.py imports it, and nothing under test does — so
        # pulling ~800MB of wheels per job would buy nothing. If a test ever
        # needs torch, this job fails and that cost gets decided on purpose.
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run tests
        run: python -m pytest -q
